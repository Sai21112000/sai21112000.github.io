---
layout: default
---
<article class="page-shell animate-enter" style="animation-delay: 0.1s;">
    <header class="page-header">
        <a href="{{ '/' | relative_url }}" class="text-link">← Index</a>
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p class="meta">{{ page.description }}</p>
        {% endif %}
    </header>

    <div class="content page-content">
        {{ content }}
    </div>
</article>
