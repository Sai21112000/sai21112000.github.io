<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">

    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
</head>
<body>
    <!-- Reading Progress Bar -->
    <div class="progress-bar" id="progress-bar"></div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">◐</button>

    <main>
        {{ content }}
    </main>

    <script>
    // Reading Progress Bar
    window.addEventListener('scroll', function() {
        var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var progress = (scrollTop / scrollHeight) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';
    });

    // Dark/Light Toggle
    (function() {
        var toggle = document.getElementById('theme-toggle');
        var savedTheme = localStorage.getItem('theme');

        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            toggle.textContent = savedTheme === 'dark' ? '◑' : '◐';
        }

        toggle.addEventListener('click', function() {
            var current = document.documentElement.getAttribute('data-theme');
            var next;

            if (current === 'dark') {
                next = 'light';
            } else if (current === 'light') {
                next = 'dark';
            } else {
                next = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
            }

            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            toggle.textContent = next === 'dark' ? '◑' : '◐';
        });
    })();

    // Image Lightbox with Zoom + Drag-to-Pan + Close Button
    (function() {
        var overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';
        overlay.innerHTML = '<button class="lightbox-close" aria-label="Close">✕</button><img src="" alt="Zoomed image">';
        document.body.appendChild(overlay);

        var overlayImg = overlay.querySelector('img');
        var closeBtn = overlay.querySelector('.lightbox-close');
        var isZoomed = false;
        var isDragging = false;
        var startX, startY, panX = 0, panY = 0;

        function closeLightbox() {
            overlay.classList.remove('active');
            overlayImg.classList.remove('zoomed');
            overlayImg.style.transform = '';
            isZoomed = false;
            panX = 0; panY = 0;
        }

        // Open lightbox on image click
        document.querySelectorAll('.content img, article img').forEach(function(img) {
            img.addEventListener('click', function(e) {
                e.stopPropagation();
                overlayImg.src = this.src;
                overlayImg.alt = this.alt;
                overlayImg.classList.remove('zoomed');
                overlayImg.style.transform = '';
                isZoomed = false;
                panX = 0; panY = 0;
                overlay.classList.add('active');
            });
        });

        // Toggle zoom on click
        overlayImg.addEventListener('click', function(e) {
            if (isDragging) return;
            e.stopPropagation();
            if (isZoomed) {
                isZoomed = false;
                overlayImg.classList.remove('zoomed');
                overlayImg.style.transform = '';
                panX = 0; panY = 0;
            } else {
                isZoomed = true;
                overlayImg.classList.add('zoomed');
                overlayImg.style.transform = 'scale(1.8)';
            }
        });

        // Drag to pan when zoomed
        overlayImg.addEventListener('mousedown', function(e) {
            if (!isZoomed) return;
            e.preventDefault();
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            overlayImg.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            overlayImg.style.transform = 'scale(1.8) translate(' + (panX / 1.8) + 'px, ' + (panY / 1.8) + 'px)';
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                overlayImg.style.cursor = 'grab';
                // Prevent the click from firing after drag
                setTimeout(function() { isDragging = false; }, 100);
            }
        });

        // Close on background click
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeLightbox();
        });

        // Close button
        closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeLightbox();
        });

        // Escape to close
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });
    })();
    </script>
</body>
</html>
